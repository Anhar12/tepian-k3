services:
  # ---- PostgreSQL (Development) ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tepian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tepian_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tepian_k3}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tepian} -d ${POSTGRES_DB:-tepian_k3}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (Development) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
