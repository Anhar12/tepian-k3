services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tepian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tepian_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tepian_k3}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tepian} -d ${POSTGRES_DB:-tepian_k3}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Database Migrations ----
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    working_dir: /app
    command: >
      sh -c "cd packages/db && npx drizzle-kit migrate"
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-tepian}:${POSTGRES_PASSWORD:-tepian_secret}@postgres:5432/${POSTGRES_DB:-tepian_k3}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---- API Server ----
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_HOSTNAME: "0.0.0.0"
      SERVER_PORT: 3000
      POSTGRES_URL: postgresql://${POSTGRES_USER:-tepian}:${POSTGRES_PASSWORD:-tepian_secret}@postgres:5432/${POSTGRES_DB:-tepian_k3}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      MEMURAI_HOST: redis
      MEMURAI_PORT: "6379"
      MEMURAI_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET: ${JWT_SECRET}
      JWT_RESET_PASSWORD_SECRET: ${JWT_RESET_PASSWORD_SECRET}
      JWT_DOCUMENT_SECRET: ${JWT_DOCUMENT_SECRET}
      JWT_LEGAL_DOCUMENT_SECRET: ${JWT_LEGAL_DOCUMENT_SECRET:-}
      JWT_TESTING_DOCUMENT_SECRET: ${JWT_TESTING_DOCUMENT_SECRET:-}
      JWT_COMPANY_DOCUMENT_SECRET: ${JWT_COMPANY_DOCUMENT_SECRET:-}
      DOCUMENT_QR_EXPIRATION: ${DOCUMENT_QR_EXPIRATION:-10y}
      DOCUMENT_VERIFICATION_BASE_URL: ${DOCUMENT_VERIFICATION_BASE_URL:-http://localhost:3001/verify}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-filesystem}
      STORAGE_PATH: /app/uploads
      UPLOADS_DIR: /app/uploads
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-ethereal}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3001}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3001/dashboard}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Not exposed publicly - nginx proxies to it
    expose:
      - "3000"

  # ---- Web (Nginx + SPA) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:
