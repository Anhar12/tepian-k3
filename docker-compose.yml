# All-in-one Docker Compose
# Starts all services: infrastructure, server, and web
#
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose down                     # Stop all services
#   docker compose logs -f                  # View logs
#
# For separate control, use individual compose files:
#   - docker-compose.infra.yml   (postgres, redis)
#   - docker-compose.server.yml  (migrations, API server)
#   - docker-compose.web.yml     (nginx + React SPA)

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tepian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tepian_k3}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tepian} -d ${POSTGRES_DB:-tepian_k3}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tepian-network

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tepian-network

  # ---- API Server ----
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker-specific overrides (these take precedence over .env)
      NODE_ENV: production
      SERVER_HOSTNAME: "0.0.0.0"
      SERVER_PORT: 3000
      POSTGRES_URL: postgresql://${POSTGRES_USER:-tepian}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tepian_k3}
      MEMURAI_HOST: redis
      MEMURAI_PORT: "6379"
      MEMURAI_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      BASE_URL: ${BASE_URL:-http://localhost:3001}
      STORAGE_PATH: /app/uploads
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Not exposed publicly - nginx proxies to it
    expose:
      - "3000"
    networks:
      - tepian-network

  # ---- Web (Nginx + SPA) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Leave empty — tRPC uses relative URLs (/trpc, /api) so nginx
        # proxies them to the backend regardless of the public hostname.
        # Only override if frontend and backend are on different domains.
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:80"
    depends_on:
      - server
    networks:
      - tepian-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  tepian-network:
    driver: bridge
