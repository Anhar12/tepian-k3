services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tepian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tepian_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tepian_k3}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tepian} -d ${POSTGRES_DB:-tepian_k3}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Database Migrations ----
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    working_dir: /app
    command: >
      sh -c "cd packages/db && npx drizzle-kit migrate"
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-tepian}:${POSTGRES_PASSWORD:-tepian_secret}@postgres:5432/${POSTGRES_DB:-tepian_k3}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---- API Server ----
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker-specific overrides (these take precedence over .env)
      NODE_ENV: production
      SERVER_HOSTNAME: "0.0.0.0"
      SERVER_PORT: 3000
      POSTGRES_URL: postgresql://${POSTGRES_USER:-tepian}:${POSTGRES_PASSWORD:-tepian_secret}@postgres:5432/${POSTGRES_DB:-tepian_k3}
      MEMURAI_HOST: redis
      MEMURAI_PORT: "6379"
      MEMURAI_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      STORAGE_PATH: /app/uploads
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Not exposed publicly - nginx proxies to it
    expose:
      - "3000"

  # ---- Web (Nginx + SPA) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:
