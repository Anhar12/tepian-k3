services:
  - type: web
    name: tepian-k3-api-dev
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_HOSTNAME
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 10000
      - key: POSTGRES_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: BASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_RESET_PASSWORD_SECRET
        sync: false
      - key: JWT_DOCUMENT_SECRET
        sync: false
      - key: JWT_LEGAL_DOCUMENT_SECRET
        sync: false
      - key: JWT_TESTING_DOCUMENT_SECRET
        sync: false
      - key: JWT_COMPANY_DOCUMENT_SECRET
        sync: false
      - key: MEMURAI_HOST
        fromService:
          type: keyvalue
          name: tepian-k3-redis-dev
          property: host
      - key: MEMURAI_PORT
        fromService:
          type: keyvalue
          name: tepian-k3-redis-dev
          property: port
      - key: MEMURAI_PASSWORD
        sync: false

  - type: keyvalue
    name: tepian-k3-redis-dev
    plan: free
    ipAllowList: []

  - type: web
    name: tepian-k3-web-dev
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @tepian-k3/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false