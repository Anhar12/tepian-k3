# Production compose — pulls pre-built images from GHCR.
# No source code or build tools needed on the target machine.
#
# Usage:
#   ./scripts/deploy-laptop.sh
#
# Or manually:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tepian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tepian_k3}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tepian} -d ${POSTGRES_DB:-tepian_k3}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tepian-network

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tepian-network

  # ---- API Server ----
  server:
    image: ghcr.io/${GHCR_USER:?GHCR_USER is required}/tepian-k3-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SERVER_HOSTNAME: "0.0.0.0"
      SERVER_PORT: 3000
      POSTGRES_URL: postgresql://${POSTGRES_USER:-tepian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tepian_k3}
      MEMURAI_HOST: redis
      MEMURAI_PORT: "6379"
      MEMURAI_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGIN: http://${LAPTOP_IP:?LAPTOP_IP is required}:${WEB_PORT:-3001}
      BASE_URL: http://${LAPTOP_IP}:${WEB_PORT:-3001}
      STORAGE_PATH: /app/uploads
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tepian-network

  # ---- Web (Nginx + SPA) ----
  web:
    image: ghcr.io/${GHCR_USER:?GHCR_USER is required}/tepian-k3-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:80"
    networks:
      - tepian-network
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  tepian-network:
    driver: bridge
