name: Sync to Coolify Repo

on:
  push:
    branches: [main]

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror main → rizrmdhn-developer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror repo
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git push "https://x-access-token:${SYNC_PAT}@github.com/rizrmdhn-developer/tepian-k3.git" HEAD:main --force
